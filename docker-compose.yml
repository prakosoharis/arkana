services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arkana}
      POSTGRES_USER: ${POSTGRES_USER:-arkana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkana_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  research:
    build: ./services/research
    environment:
      RESEARCH_API_TOKEN: ${RESEARCH_API_TOKEN:?RESEARCH_API_TOKEN must be set; the research API refuses every request without it}
      DATABASE_URL: ${RESEARCH_DATABASE_URL:-postgresql+psycopg://arkana:arkana_local_only@postgres:5432/arkana}
      DATA_ROOT: ${RESEARCH_DATA_ROOT:-/workspace/data/processed}
      MT5_COMMON_FILES_ROOT: /workspace/mt5-common
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-UNCONFIGURED}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_PROTOCOL: ${AI_PROTOCOL:-}
      AI_ENDPOINT_PATH: ${AI_ENDPOINT_PATH:-}
      AI_JSON_MODE: ${AI_JSON_MODE:-}
      AI_THINKING_ENABLED: ${AI_THINKING_ENABLED:-}
      AI_AUTH_HEADER: ${AI_AUTH_HEADER:-}
      AI_AUTH_PREFIX: ${AI_AUTH_PREFIX:-}
      AI_EXTRA_HEADERS_JSON: ${AI_EXTRA_HEADERS_JSON:-}
      META_MODEL_API_KEY: ${META_MODEL_API_KEY:-}
      META_MODEL_API_BASE_URL: ${META_MODEL_API_BASE_URL:-}
      META_MODEL_ID: ${META_MODEL_ID:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_MODEL_REASONING: ${AI_MODEL_REASONING:-}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-0}
      AI_REQUEST_LIMIT: ${AI_REQUEST_LIMIT:-100}
      AI_REQUEST_MAX_INPUT_TOKENS: ${AI_REQUEST_MAX_INPUT_TOKENS:-4000}
      AI_REQUEST_MAX_OUTPUT_TOKENS: ${AI_REQUEST_MAX_OUTPUT_TOKENS:-1600}
      AI_REQUEST_MAX_COST_USD: ${AI_REQUEST_MAX_COST_USD:-0.05}
      HISTORICAL_SYNC_INTERVAL_SECONDS: ${HISTORICAL_SYNC_INTERVAL_SECONDS:-3600}
      HISTORICAL_SYNC_POLL_SECONDS: ${HISTORICAL_SYNC_POLL_SECONDS:-30}
      HISTORICAL_SYNC_RESPONSE_TIMEOUT_SECONDS: ${HISTORICAL_SYNC_RESPONSE_TIMEOUT_SECONDS:-300}
    volumes:
      - ./data:/workspace/data
      - ${MT5_COMMON_FILES_ROOT:-./data/mt5-common}:/workspace/mt5-common
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      RESEARCH_API_URL: ${RESEARCH_API_URL:-http://research:8000}
      RESEARCH_API_TOKEN: ${RESEARCH_API_TOKEN:?RESEARCH_API_TOKEN must be set; the BFF cannot reach the research API without it}
      NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - research

volumes:
  postgres-data:
